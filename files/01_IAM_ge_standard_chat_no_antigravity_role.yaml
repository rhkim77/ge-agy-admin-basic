# ==============================================================================
# File 01: Custom IAM role for Web-App-only users (AI developer tools blocked)
#
# Source: roles/discoveryengine.agentspaceUser (Gemini Enterprise User), read on
# 2026-11-23. That role had 135 permissions. This file keeps 129 of them:
#   - removes the 5 businessaicode.* permissions (Google Antigravity and the
#     other AI developer tools), as described in
#     https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-creating-custom-roles
#   - leaves out resourcemanager.projects.list, which is not offered for
#     project-level custom roles
# The 7 discoveryengine.immersiveArtifacts.* permissions that Canvas needs are
# included.
#
# The predefined role changes as the product changes. Before production use,
# compare this list with the current role:
#   gcloud iam roles describe roles/discoveryengine.agentspaceUser \
#     --format="value(includedPermissions)" | tr ';' '\n' | grep -v '^businessaicode\.'
#
# Usage:
#   gcloud iam roles create geStandardChatUser \
#     --project=PROJECT_ID \
#     --file=01_IAM_ge_standard_chat_no_antigravity_role.yaml
# ==============================================================================
title: "GE Standard Chat User (No Antigravity)"
